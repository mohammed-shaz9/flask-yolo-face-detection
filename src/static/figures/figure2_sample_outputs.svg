<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Helvetica,Arial,sans-serif">
  <style>
    .title{font-size:24px;font-weight:bold}
    .caption{font-size:14px;fill:#555}
    .label{font-size:14px;font-weight:bold}
    .imgBox{fill:none;stroke:#4e73df;stroke-width:2}
  </style>
  <text x="500" y="30" text-anchor="middle" class="title">Sample Detection Outputs</text>

  <!-- Image placeholders (replace href with actual data URI or image path) -->
  <g>
    <image x="100" y="70" width="350" height="220" href="fig2_normal.jpg" />
    <rect x="100" y="70" width="350" height="220" class="imgBox"/>
    <text x="275" y="310" text-anchor="middle" class="label">(a) Normal Face Detection</text>
  </g>

  <g>
    <image x="550" y="70" width="350" height="220" href="fig2_masked.jpg" />
    <rect x="550" y="70" width="350" height="220" class="imgBox"/>
    <text x="725" y="310" text-anchor="middle" class="label">(b) Masked / Occluded</text>
  </g>

  <g>
    <image x="100" y="330" width="350" height="220" href="fig2_lowlight.jpg" />
    <rect x="100" y="330" width="350" height="220" class="imgBox"/>
    <text x="275" y="570" text-anchor="middle" class="label">(c) Low-light Face</text>
  </g>

  <g>
    <image x="550" y="330" width="350" height="220" href="fig2_fallback.jpg" />
    <rect x="550" y="330" width="350" height="220" class="imgBox"/>
    <text x="725" y="570" text-anchor="middle" class="label">(d) Fallback person class</text>
  </g>

  <text x="500" y="590" text-anchor="middle" class="caption">Figure 2: Sample outputs showing detection under normal, occluded, and low-light conditions, and fallback detection.</text>
</svg>